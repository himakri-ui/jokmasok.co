<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk | Jasa Joki</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script defer src="js/pages/login.js"></script>
</head>

<body class="login-page">
    <main class="login-card">
        <div class="login-art">
            <img src="img/login-illustration.png" alt="">
            <a class="login-brand" href="index.html">
                <span class="login-brand-symbol" aria-hidden="true">
                    <img src="img/JOKMASOK.png" alt="">
                </span>
                <img class="login-brand-wordmark" src="img/JOK.png" alt="JOKMASOK.CO">
            </a>
        </div>

        <a class="login-close" href="index.html" aria-label="Kembali ke beranda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"/>
            </svg>
        </a>

        <section class="login-panel" aria-labelledby="login-title">
            <div class="login-content">
                <h1 id="login-title">Masuk</h1>

                <form id="login-form" method="post">
                    <div class="login-field">
                        <label for="login-identifier">Email atau nomor HP</label>
                        <div class="login-input">
                            <input
                                id="login-identifier"
                                name="identifier"
                                type="text"
                                autocomplete="username"
                                autocapitalize="none"
                                spellcheck="false"
                                placeholder="Masukkan email atau nomor HP"
                                required
                            >
                        </div>
                    </div>

                    <div class="login-field">
                        <label for="login-password">Kata sandi</label>
                        <div class="login-input">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.7" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="11" rx="2"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
                            </svg>
                            <input
                                id="login-password"
                                name="password"
                                type="password"
                                placeholder="Masukkan kata sandi"
                                autocomplete="current-password"
                                required
                            >
                            <button
                                class="login-reveal"
                                id="login-reveal"
                                type="button"
                                aria-label="Tampilkan kata sandi"
                                aria-controls="login-password"
                                aria-pressed="false"
                                hidden
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.7" stroke-linecap="round"
                                     stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/>
                                    <circle cx="12" cy="12" r="2.5"/>
                                    <path class="login-reveal-slash" d="m4 4 16 16"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <a class="login-forgot" href="reset-password.html">Lupa kata sandi?</a>
                    <button class="login-submit" id="login-submit" type="submit" disabled>
                        Masuk
                    </button>
                    <p class="login-status" id="login-status" role="status"></p>
                </form>

                <div class="login-social" aria-label="Pilihan login yang belum tersedia">
                    <div class="login-divider">Atau lanjutkan dengan</div>

                    <div class="login-providers">
                        <button type="button" disabled aria-label="Google, belum tersedia">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3a10 10 0 0 0 2.9-7.5Z"/>
                                <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.3l-3.3-2.6c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3v2.7A10 10 0 0 0 12 22Z"/>
                                <path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-4V7.3H3a10 10 0 0 0 0 9.4l3.4-2.7Z"/>
                                <path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A9.6 9.6 0 0 0 12 2a10 10 0 0 0-9 5.3L6.4 10c.8-2.3 3-4.1 5.6-4.1Z"/>
                            </svg>
                        </button>

                        <button type="button" disabled aria-label="Facebook, belum tersedia">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="10" fill="#1877F2"/>
                                <path fill="#fff" d="M13.5 22v-7.7h2.6l.4-3h-3V9.4c0-.9.3-1.5 1.5-1.5h1.6V5.2c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.1H7.6v3h2.6v7.5c.6.1 1.2.2 1.8.2h1.5Z"/>
                            </svg>
                        </button>

                        <button type="button" disabled aria-label="Apple, belum tersedia">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#17151a" d="M17.1 2c.1 1.3-.5 2.5-1.2 3.4-.8.9-2 1.5-3.2 1.4-.2-1.2.5-2.5 1.2-3.3.8-.9 2.2-1.5 3.2-1.5ZM20.5 16.5c-.4.9-.6 1.3-1.1 2.1-.8 1.1-1.8 2.5-3.1 2.5-1.2 0-1.5-.8-3.1-.8s-2 .8-3.2.8c-1.3 0-2.2-1.3-3-2.4C4.9 15.5 4 11.9 5.3 9.5a4.8 4.8 0 0 1 4.1-2.6c1.3 0 2.1.8 3.1.8 1 0 1.6-.8 3.1-.8 1.3 0 2.7.7 3.6 1.9-3.2 1.7-2.7 6.2 1.3 7.7Z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <p class="login-register">
                    Belum punya akun? <a href="daftar.html">Daftar di sini</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
